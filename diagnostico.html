<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico de pantalla — RRHH Simple</title>
<style>
  *{ box-sizing: border-box; }
  body{ font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 14px; background: #faf8f3; color: #1a1a1a; }
  h1{ font-size: 19px; margin: 0 0 6px; }
  h2{ font-size: 16px; margin: 22px 0 6px; }
  p{ font-size: 13px; color: #4a4732; margin: 6px 0; }
  table{ width: 100%; border-collapse: collapse; table-layout: fixed; }
  td{ padding: 6px 2px; border-bottom: 1px solid #d4cfc0; font-size: 13px; word-break: break-word; }
  td:first-child{ color: #4a4732; width: 58%; font-family: ui-monospace, monospace; }
  td:last-child{ text-align: right; font-weight: 700; }
  .mal{ color: #b3261e; }
  .bien{ color: #1b6b3a; }
  .regla{ height: 10px; background: #ffde59; margin: 12px 0 2px; }
  #lista li{ font-size: 12px; font-family: ui-monospace, monospace; word-break: break-all; margin-bottom: 4px; }
  iframe{ position: absolute; left: -9999px; top: 0; width: 100%; height: 900px; border: 0; }
  #veredicto{ font-weight: 700; font-size: 15px; padding: 10px; border-radius: 10px; background: #e8e5da; }
</style>
</head>
<body>
<h1>Diagnóstico de pantalla</h1>
<p>Haz una captura de esta pantalla entera y envíamela. <b>No actives la vista de ordenador.</b></p>

<div class="regla"></div>
<p>La barra amarilla tiene que llegar justo de borde a borde.</p>

<table id="t"></table>

<h2>La portada medida en tu móvil</h2>
<p id="estado">Cargando la portada para medirla…</p>
<div id="veredicto" hidden></div>
<ul id="lista"></ul>

<iframe id="marco" src="index.html" title="Portada en pruebas"></iframe>

<script>
(function () {
  var vv = window.visualViewport || {};
  var sonda = document.createElement('div');
  sonda.style.cssText = 'width:100%;height:1px';
  document.body.appendChild(sonda);
  var anchoSonda = Math.round(sonda.getBoundingClientRect().width);
  sonda.remove();

  var filas = [
    ['innerWidth', window.innerWidth + ' px'],
    ['screen.width', screen.width + ' px'],
    ['clientWidth', document.documentElement.clientWidth + ' px'],
    ['div al 100 %', anchoSonda + ' px'],
    ['visualViewport.width', vv.width ? Math.round(vv.width) + ' px' : '—'],
    ['zoom (scale)', vv.scale != null ? Math.round(vv.scale * 1000) / 1000 : '—'],
    ['devicePixelRatio', window.devicePixelRatio],
    ['1rem mide', getComputedStyle(document.documentElement).fontSize],
    ['vista de ordenador', window.innerWidth > screen.width + 40 ? 'SÍ (desactívala)' : 'no']
  ];
  var t = document.getElementById('t');
  filas.forEach(function (f) {
    var tr = t.insertRow();
    tr.insertCell().textContent = f[0];
    var c = tr.insertCell();
    c.textContent = f[1];
    if (f[0] === 'zoom (scale)' && f[1] !== 1 && f[1] !== '—') c.className = 'mal';
    if (f[0] === '1rem mide' && f[1] !== '16px') c.className = 'mal';
    if (f[0] === 'vista de ordenador' && f[1] !== 'no') c.className = 'mal';
  });

  /* La portada se carga en un marco del ancho real del móvil y se buscan
     los elementos que se salgan por la derecha. Mismo dominio, así que
     se puede medir desde aquí. */
  var marco = document.getElementById('marco');
  var estado = document.getElementById('estado');
  var veredicto = document.getElementById('veredicto');
  var lista = document.getElementById('lista');

  marco.addEventListener('load', function () {
    setTimeout(function () {
      try {
        var d = marco.contentDocument;
        var ancho = d.documentElement.clientWidth;
        var malos = [];
        d.querySelectorAll('body *').forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.width > 0 && r.right > ancho + 1 && (el.className || '').toString().indexOf('skip') === -1) {
            malos.push(el.tagName.toLowerCase() + (el.className ? '.' + el.className.toString().trim().split(/\s+/)[0] : '') +
                       ' — ancho ' + Math.round(r.width) + ', se sale ' + Math.round(r.right - ancho) + ' px');
          }
        });
        estado.textContent = 'Portada medida a ' + ancho + ' px de ancho.';
        veredicto.hidden = false;
        if (malos.length === 0) {
          veredicto.textContent = '✓ Nada se sale. La portada encaja en tu pantalla.';
          veredicto.className = 'bien';
        } else {
          veredicto.textContent = '✗ ' + malos.length + ' elemento(s) se salen por la derecha:';
          veredicto.className = 'mal';
          malos.slice(0, 10).forEach(function (m) {
            var li = document.createElement('li');
            li.textContent = m;
            lista.appendChild(li);
          });
        }
      } catch (e) {
        estado.textContent = 'No se ha podido medir la portada: ' + e.message;
      }
    }, 2600);
  });
})();
</script>
</body>
</html>
