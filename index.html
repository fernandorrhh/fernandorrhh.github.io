<meta charset="utf-8">

<title>RRHH Simple · Plataforma</title>

<body>
<div class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="brand"><div class="brand-mark">RS</div><b>RRHH Simple</b></div>
  <button class="icon-btn" data-open-search aria-label="Buscar"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button class="icon-btn" data-new-task aria-label="Nueva tarea" style="background:var(--accent);color:var(--on-accent);border-color:transparent"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">RS</div><div><b>RRHH Simple</b><small>Plataforma de trabajo</small></div></div>
    <div style="display:flex;gap:8px">
      <button class="search-btn" data-open-search><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Buscar<kbd>Ctrl K</kbd></button>
      <button class="btn" data-new-task aria-label="Nueva tarea" title="Nueva tarea" style="padding:0 12px;flex:none"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="side-foot">
      <button class="save" id="saveBtn"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg></span><span><b>Guardar copia</b><small><i id="saveDot"></i><span id="saveTxt">…</span></small></span></button>
      <div class="theme" role="group" aria-label="Tema">
        <span class="thumb" id="themeThumb"></span>
        <button data-t="light" aria-label="Modo claro" title="Claro"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-t="dark" aria-label="Modo oscuro" title="Oscuro"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
        <button data-t="auto" aria-label="Automático (según el sistema)" title="Automático"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      </div>
      <div class="privacy"><i></i>Datos solo en este equipo</div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- Ficus, el asistente (personaje original) -->
<div class="ficus" id="ficus" data-s="idle">
  <div class="bubble hide" id="bubble" role="status" aria-live="polite">
    <button class="x" id="fClose" aria-label="Ocultar mensaje"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <b class="who">Ficus</b><span id="fMsg"></span>
    <div class="acts"><button id="fNext">Otro</button><button id="fMute">Silenciar</button></div>
  </div>
  <button class="plant" id="plant" aria-label="Ficus, tu asistente. Pulsa para un consejo; doble clic para minimizar">
    <svg viewBox="0 0 120 150" aria-hidden="true">
      <g class="f-spark" style="transform-origin:60px 40px"><path d="M14 30l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="var(--accent)"/><path d="M104 20l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="var(--accent)"/><circle cx="98" cy="52" r="3" fill="var(--accent)"/></g>
      <g class="f-body">
        <g class="f-leaves">
          <path d="M60 96 C60 80 58 62 60 40" stroke="var(--leaf-2)" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="44" cy="44" rx="15" ry="9" transform="rotate(-30 44 44)" fill="var(--leaf-1)"/>
          <ellipse cx="76" cy="38" rx="15" ry="9" transform="rotate(25 76 38)" fill="var(--leaf-3)"/>
          <ellipse cx="60" cy="24" rx="10" ry="15" fill="var(--leaf-1)"/>
          <ellipse cx="40" cy="66" rx="14" ry="8" transform="rotate(-15 40 66)" fill="var(--leaf-2)"/>
          <ellipse cx="66" cy="54" rx="9" ry="6" transform="rotate(10 66 54)" fill="var(--leaf-2)"/>
          <g class="f-arm"><path d="M62 74 C70 72 76 68 80 64" stroke="var(--leaf-2)" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="88" cy="60" rx="12" ry="7" transform="rotate(-20 88 60)" fill="var(--leaf-3)"/></g>
          <g class="f-dots" fill="var(--muted)"><circle cx="92" cy="22" r="3"/><circle cx="101" cy="18" r="3"/><circle cx="110" cy="14" r="3"/></g>
        </g>
        <path d="M30 96 h60 l-7 46 a6 6 0 0 1 -6 5 h-34 a6 6 0 0 1 -6 -5 z" fill="var(--pot)"/>
        <rect x="27" y="92" width="66" height="12" rx="5" fill="var(--pot)"/>
        <rect x="31" y="128" width="58" height="5" rx="2.5" fill="var(--pot-band)" opacity=".9"/>
        <g class="f-eyes"><ellipse cx="50" cy="113" rx="5" ry="6" fill="var(--face)"/><ellipse cx="70" cy="113" rx="5" ry="6" fill="var(--face)"/>
          <g class="f-pupils" id="pupils"><circle cx="50" cy="114" r="2.6" fill="#1a1a1a"/><circle cx="70" cy="114" r="2.6" fill="#1a1a1a"/></g></g>
        <path class="f-mouth" d="M54 121 Q60 125 66 121" stroke="var(--face)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <circle cx="42" cy="121" r="3" fill="#e9a28a" opacity=".55"/><circle cx="78" cy="121" r="3" fill="#e9a28a" opacity=".55"/>
      </g>
    </svg>
  </button>
</div>

<!-- Nueva tarea -->
<dialog id="taskDlg" aria-labelledby="tdT" class="tk-dlg">
  <form class="dlg" method="dialog" id="taskForm">
    <div class="dlg-b">
      <div class="seg tk-seg" id="tTipo" role="group" aria-label="Tipo"><span class="thumb"></span><button type="button" data-tipo="tarea" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tarea</button><button type="button" data-tipo="recordatorio" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg>Recordatorio</button></div>
      <h2 id="tdT" style="font-size:20px;font-weight:600;margin:14px 0 0">Nueva tarea</h2>
      <div class="field"><label for="tTitle">Título</label><input id="tTitle" required maxlength="160" autocomplete="off"></div>
      <div class="row2">
        <div class="field tk-catbox" id="tCatBox"><label for="tCat">Categoría</label><select id="tCat"></select></div>
        <div class="field"><label for="tDate" id="tDateLbl">Fecha límite</label><input type="date" id="tDate">
          <div class="quick-dates"><button type="button" data-fecha-rapida="0">Hoy</button><button type="button" data-fecha-rapida="1">Mañana</button><button type="button" data-fecha-rapida="lunes">Lunes</button><button type="button" data-fecha-rapida="sin">Sin fecha</button></div></div>
      </div>
      <div><span class="flabel">Importancia</span>
        <div class="prio-pick">
          <input type="radio" name="p" id="pA" value="alta"><label for="pA"><i class="prio alta"></i>Alta</label>
          <input type="radio" name="p" id="pM" value="media" checked><label for="pM"><i class="prio media"></i>Media</label>
          <input type="radio" name="p" id="pB" value="baja"><label for="pB"><i class="prio baja"></i>Baja</label>
        </div></div>
      <div class="tk-opts">
        <label class="check" id="tAvisoBox"><input type="checkbox" id="tAviso"> Avisar en el calendario</label>
        <div class="field tk-inline" id="tAntBox" hidden><label for="tAnt">Aviso</label><select id="tAnt"></select></div>
        <div class="field tk-inline"><label for="tRep">Se repite</label><select id="tRep"><option value="">No</option><option value="semana">Cada semana</option><option value="mes">Cada mes</option><option value="anio">Cada año</option></select></div>
        <label class="check"><input type="checkbox" id="tFij"> Fijar (siempre a la vista)</label>
      </div>
      <div id="tPersona"></div>
      <div class="field"><label for="tNota">Notas <span class="muted" style="font-weight:400">(opcional)</span></label><textarea id="tNota" rows="2" maxlength="2000" placeholder="Detalles, a quién afecta, enlaces…"></textarea></div>
    </div>
    <div class="dlg-f"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn ghost" value="abrir">Crear y abrir</button><button class="btn" value="ok" id="tOk">Crear tarea</button></div>
  </form>
</dialog>

<!-- Buscador -->
<dialog id="cmdk" aria-label="Buscador">
  <div class="dlg">
    <div class="cmd-in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cmdIn" placeholder="Busca una herramienta o una acción…" role="combobox" aria-expanded="true" aria-controls="cmdList" autocomplete="off"><kbd>Esc</kbd></div>
    <ul class="cmd-list" id="cmdList" role="listbox"></ul>
  </div>
</dialog>

<div class="toast" id="toast" hidden role="status"><svg class="i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span id="toastTxt"></span><button id="toastBtn" class="toast-btn" hidden></button></div>
